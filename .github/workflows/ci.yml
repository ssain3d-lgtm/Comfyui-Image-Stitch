name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml and one current release.
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python test dependencies
        # --extra-index-url, not --index-url: the latter replaces PyPI entirely,
        # leaving torch's own dependencies resolvable only from the CPU wheel
        # index. Upper bounds keep a major release from breaking CI silently.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "numpy>=1.24,<3" "pillow>=10,<13" "torch>=2.2,<3" "av>=12,<20"

      - name: Python syntax check
        run: python -m compileall -q __init__.py multi_stitch.py tests

      - name: JavaScript syntax check
        # Globbed, so a newly added file cannot silently escape the check.
        run: |
          shopt -s nullglob
          files=(web/*.js)
          if [ ${#files[@]} -eq 0 ]; then echo "no JavaScript files found" >&2; exit 1; fi
          for file in "${files[@]}"; do
            echo "node --check $file"
            node --check "$file"
          done
        shell: bash

      - name: Backend unit tests
        # Includes a package-import smoke test, so a node that would fail to
        # load in ComfyUI fails here too, and a parity test that runs the
        # browser maths under Node and compares it with Python.
        run: python -m unittest discover -s tests -p "test_*.py" -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Frontend tests
        # logic.test.mjs drives the real web/*.js under Node with a stub
        # ComfyUI; browser.test.mjs runs the crop editor and clipboard copy in
        # Chromium.
        run: npm test
