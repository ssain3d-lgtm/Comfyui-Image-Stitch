# Publishes the node to the Comfy Registry.
#
# A push never starts this on its own. ci.yml calls it from its last job, which
# waits for every test job to succeed first, so a commit that turned the tests
# red cannot reach the registry; and it is asked for the commit the push started
# from, so a push that did not change the version in pyproject.toml publishes
# nothing. "Run workflow" in the Actions tab still publishes by hand, without
# comparing anything.
#
# Needs a REGISTRY_ACCESS_TOKEN repository secret (an API key of the publisher
# named in pyproject.toml); without one the job skips with a notice instead of
# failing.
name: Publish to Comfy registry

on:
  workflow_dispatch:
    inputs:
      before:
        description: "Publish only if pyproject.toml's version differs from the one at this commit. Empty: publish."
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      before:
        description: "The commit the push started from. Publish only if pyproject.toml's version differs from the one there. Empty: publish."
        type: string
        required: false
        default: ""
    secrets:
      REGISTRY_ACCESS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # All of it: the version is read at the commit the push started from
          # as well as at the one it ended on.
          fetch-depth: 0

      - name: Did the version change?
        id: version
        env:
          BEFORE: ${{ inputs.before }}
        # Writes changed=true|false and version=… to the step's outputs, and says
        # why in the log.
        run: python3 scripts/version_changed.py "$BEFORE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Nothing to publish
        if: steps.version.outputs.changed != 'true'
        run: echo "::notice::pyproject.toml's version did not change in this push, so nothing is published."

      - name: Check for the registry token
        id: token
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::notice::REGISTRY_ACCESS_TOKEN is not set; skipping the registry publish."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Custom Node
        if: steps.version.outputs.changed == 'true' && steps.token.outputs.present == 'true'
        # Pinned to a commit, not @main: this step is handed the registry token,
        # so it must not change without a reviewed pull request. Dependabot
        # proposes the bumps.
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9 # main as of 2026-09-12
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
