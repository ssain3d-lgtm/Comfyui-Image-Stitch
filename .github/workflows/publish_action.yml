# Publishes the node to the Comfy Registry whenever the version in
# pyproject.toml changes on main. Needs a REGISTRY_ACCESS_TOKEN repository
# secret (an API key of the publisher named in pyproject.toml); without one
# the job skips with a notice instead of failing.
name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check for the registry token
        id: token
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::notice::REGISTRY_ACCESS_TOKEN is not set; skipping the registry publish."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Custom Node
        if: steps.token.outputs.present == 'true'
        # Pinned to a commit, not @main: this step is handed the registry token,
        # so it must not change without a reviewed pull request. Dependabot
        # proposes the bumps.
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9 # main as of 2026-09-12
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
